name: build-baseline

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  # docs/BASELINE.txt — clienteafirma 1.9.1
  CLIENTEAFIRMA_REF: 0d7f3cf01fb65d2be5b245622d2c8f490f36e718

permissions:
  contents: read

jobs:
  build-linux-jdk8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@v4

      - name: Checkout clienteafirma (baseline)
        uses: actions/checkout@v4
        with:
          repository: ctt-gob-es/clienteafirma
          ref: ${{ env.CLIENTEAFIRMA_REF }}
          path: clienteafirma

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: clienteafirma/pom.xml

      - name: Build (install, skip unit tests that need Red SARA)
        working-directory: clienteafirma
        run: mvn -B clean install -DskipTests -Denv=install

      - name: Upload autofirma.jar
        uses: actions/upload-artifact@v4
        with:
          name: autofirma-jar
          path: clienteafirma/afirma-simple/target/autofirma.jar

      - name: Upload installed es.gob.afirma Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma
          if-no-files-found: error

  f2-vectors:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@v4

      - name: Checkout clienteafirma (baseline)
        uses: actions/checkout@v4
        with:
          repository: ctt-gob-es/clienteafirma
          ref: ${{ env.CLIENTEAFIRMA_REF }}
          path: clienteafirma

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: |
            clienteafirma/pom.xml
            tests/validation-harness/pom.xml

      - name: Restore es.gob.afirma artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma

      - name: Download autofirma.jar
        uses: actions/download-artifact@v4
        with:
          name: autofirma-jar
          path: clienteafirma/afirma-simple/target

      - name: F2 regression gate
        run: bash scripts/f2-regression.sh

      - name: F2 validation harness (integrity + negatives)
        working-directory: tests/validation-harness
        run: mvn -B test -Dvectors.dir=${{ github.workspace }}/vectors

      - name: Upload vector manifest
        uses: actions/upload-artifact@v4
        with:
          name: f2-manifest
          path: vectors/manifest/latest.txt

  upstream-validation-tests:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@v4

      - name: Checkout clienteafirma (baseline)
        uses: actions/checkout@v4
        with:
          repository: ctt-gob-es/clienteafirma
          ref: ${{ env.CLIENTEAFIRMA_REF }}
          path: clienteafirma

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: clienteafirma/pom.xml

      - name: Restore es.gob.afirma artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma

      - name: afirma-crypto-validation unit tests
        working-directory: clienteafirma
        run: mvn -B -pl afirma-crypto-validation test

      - name: CAdES unit tests
        working-directory: clienteafirma
        run: mvn -B -pl afirma-crypto-cades test

      - name: PDF unit tests (no DNIe / no broken Baseline inners)
        working-directory: clienteafirma
        run: >
          mvn -B -pl afirma-crypto-pdf test
          -Dtest='TestPAdES*,TestPasswordPDF,TestPdf*,TestSign*,TestGet*,!MiniTestDNI,!TestPadesBaseline'
          -Dsurefire.failIfNoSpecifiedTests=false

  compile-matrix-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@v4

      - name: Checkout clienteafirma (baseline)
        uses: actions/checkout@v4
        with:
          repository: ctt-gob-es/clienteafirma
          ref: ${{ env.CLIENTEAFIRMA_REF }}
          path: clienteafirma

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: clienteafirma/pom.xml

      - name: Compile probe (not product target)
        working-directory: clienteafirma
        # Soft probe: record failure without failing the matrix cell hard
        run: |
          set +e
          mvn -B -DskipTests -Denv=install package
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "PROBE_FAIL java=${{ matrix.java }} exit=$code"
          fi
          exit 0

  sbom:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout meta-repo
        uses: actions/checkout@v4

      - name: Checkout clienteafirma (baseline)
        uses: actions/checkout@v4
        with:
          repository: ctt-gob-es/clienteafirma
          ref: ${{ env.CLIENTEAFIRMA_REF }}
          path: clienteafirma

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: clienteafirma/pom.xml

      - name: Restore es.gob.afirma artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-afirma
          path: ~/.m2/repository/es/gob/afirma

      - name: CycloneDX SBOM or dependency tree
        working-directory: clienteafirma
        run: |
          if mvn -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.8.1:makeAggregateBom \
              -DoutputFormat=json -DoutputName=bom; then
            mkdir -p "$GITHUB_WORKSPACE/docs"
            cp -f target/bom.json "$GITHUB_WORKSPACE/docs/bom.json" 2>/dev/null || true
          else
            mkdir -p "$GITHUB_WORKSPACE/docs"
            mvn -B -DskipTests dependency:tree > "$GITHUB_WORKSPACE/docs/dependency-tree.txt"
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: |
            docs/bom.json
            docs/dependency-tree.txt
            clienteafirma/target/bom.json
          if-no-files-found: warn
