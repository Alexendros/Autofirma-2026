name: build-baseline

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-jdk8:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clienteafirma
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build (install, skip unit tests that need Red SARA)
        run: mvn -B clean install -DskipTests -Denv=install
      - name: Upload autofirma.jar
        uses: actions/upload-artifact@v4
        with:
          name: autofirma-jar
          path: clienteafirma/afirma-simple/target/autofirma.jar

  f2-vectors:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          name: autofirma-jar
          path: clienteafirma/afirma-simple/target
      - name: F2 regression gate
        run: bash scripts/f2-regression.sh
      - name: F2 validation harness (integrity + negatives)
        run: |
          cd tests/validation-harness
          mvn -B test -Dvectors.dir="${{ github.workspace }}/vectors"
      - name: Upload vector manifest
        uses: actions/upload-artifact@v4
        with:
          name: f2-manifest
          path: vectors/manifest/latest.txt

  upstream-validation-tests:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clienteafirma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: afirma-crypto-validation unit tests
        run: |
          mvn -B -pl afirma-crypto-validation -am install -DskipTests -q
          mvn -B -pl afirma-crypto-validation test
      - name: CAdES + PDF unit tests (no DNIe)
        run: |
          mvn -B -pl afirma-crypto-cades test
          mvn -B -pl afirma-crypto-pdf test \
            -Dtest='TestPAdES*,TestPasswordPDF,TestPdf*,TestSign*,TestGet*,!MiniTestDNI,!TestPadesBaseline' \
            -Dsurefire.failIfNoSpecifiedTests=false

  compile-matrix-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]
    defaults:
      run:
        working-directory: clienteafirma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compile probe (not product target)
        run: mvn -B -DskipTests -Denv=install package || echo "PROBE_FAIL java=${{ matrix.java }}"

  sbom:
    needs: build-linux-jdk8
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clienteafirma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: CycloneDX SBOM
        run: |
          mvn -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.8.1:makeAggregateBom \
            -DoutputFormat=json -DoutputName=bom || \
          mvn -B -DskipTests dependency:tree > ../docs/dependency-tree.txt
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: |
            clienteafirma/target/bom.json
            docs/dependency-tree.txt
